name: Notify Forge controller release
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-check:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real virtual-environment worker heartbeats and update handoff
        run: python -m unittest discover -s tests/windows -p test_managed_launcher_process.py -v
  ea-lifecycle-check:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and geometry test dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'opencv-python>=4.12,<5'
      - name: Verify native windows, EA recovery, and repeated account lifecycle
        run: python -m unittest discover -s tests/windows -p 'test_ea_*.py' -v
      - name: Verify version handoff preserves recovery limits and running games
        run: python -m unittest discover -s tests/windows -p test_managed_update.py -v
      - name: Verify lease cleanup and restart reconciliation
        run: python -m unittest discover -s tests/windows -p test_account_orchestration.py -v
  registration-check:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same dependencies as the managed updater
        run: python -m pip install -r windows/requirements.txt
      - name: Verify the bundled runtime without a Forge checkout
        working-directory: windows
        run: python -m apex_registration --check-runtime
      - name: Install Chromium for offline browser fixtures
        run: python -m playwright install chromium
      - name: Verify registration, recovery, and machine configuration
        run: python -m unittest discover -s tests/windows -p 'test_registration*.py' -v
  notify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [runtime-check, ea-lifecycle-check, registration-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Register pushed version in Forge
        env:
          FORGE_RELEASE_URL: ${{ vars.FORGE_RELEASE_URL }}
          FORGE_RELEASE_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
        run: python3 scripts/notify-forge-release.py
