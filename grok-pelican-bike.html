<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车2D动画</title>
<style>
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(#87CEEB, #E0F7FA);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: Arial, sans-serif;
}
svg {
  border: 4px solid #2E8B57;
  background: #87CEEB;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
</style>
</head>
<body>
<svg id="svgCanvas" width="800" height="400" viewBox="0 0 800 400">
  <!-- 地面 -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#228B22" stroke-width="35" />

  <!-- 自行车后轮 -->
  <g id="rearWheel" transform="rotate(0 280 280)">
    <circle cx="280" cy="280" r="62" fill="#8B4513"/>
    <circle cx="280" cy="280" r="52" fill="#333"/>
    <circle cx="280" cy="280" r="6" fill="#FF0"/>
    <circle cx="280" cy="280" r="5" fill="#000"/>
  </g>
  <animateTransform attributeName="transform" type="rotate" from="0 280 280" to="360 280 280" dur="1s" repeatCount="indefinite" />

  <!-- 自行车前轮 -->
  <g id="frontWheel" transform="rotate(0 550 280)">
    <circle cx="550" cy="280" r="62" fill="#8B4513"/>
    <circle cx="550" cy="280" r="52" fill="#333"/>
    <circle cx="550" cy="280" r="5" fill="#000"/>
  </g>
  <animateTransform attributeName="transform" type="rotate" from="0 550 280" to="360 550 280" dur="1s" repeatCount="indefinite" />

  <!-- 自行车车架 -->
  <line x1="280" y1="220" x2="550" y2="180" stroke="#8B4513" stroke-width="16"/>
  <animate attributeName="x1" values="280;680;280" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="550;950;550" dur="10s" repeatCount="indefinite"/>

  <!-- 自行车座椅 -->
  <rect x="510" y="170" width="55" height="22" fill="#8B4513" rx="6"/>
  <animate attributeName="x" values="510;710;510" dur="10s" repeatCount="indefinite"/>

  <!-- 自行车把手 -->
  <line x1="520" y1="200" x2="600" y2="200" stroke="#8B4513" stroke-width="12"/>
  <line x1="600" y1="200" x2="625" y2="190" stroke="#8B4513" stroke-width="12"/>

  <!-- 鹈鹕 -->
  <g id="pelican" transform="translate(480,210)">
    <!-- 鹈鹕身体 -->
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="#E0E0E0"/>
    <!-- 鹈鹕头部 -->
    <ellipse cx="0" cy="-65" rx="38" ry="48" fill="#E0E0E0"/>
    <!-- 鹈鹕脖子 -->
    <line x1="-25" y1="-25" x2="0" y2="-35" stroke="#E0E0E0" stroke-width="28"/>
    <!-- 鹈鹕大嘴 -->
    <polygon points="0,-35 85,-22 0,-12" fill="#FF8C00"/>
    <!-- 鹈鹕眼睛 -->
    <circle cx="18" cy="-48" r="9" fill="#111111"/>
    <!-- 左翅膀 -->
    <polygon transform="rotate(0 -78,18)" points="-80,0 -98,18 -80,48" fill="#E8E8E8"/>
    <animateTransform attributeName="transform" type="rotate" from="0 -78,18" to="35 -78,18" dur="0.55s" repeatCount="indefinite"/>
    <!-- 右翅膀 -->
    <polygon transform="rotate(0 78,18)" points="80,0 98,18 80,48" fill="#E8E8E8"/>
    <animateTransform attributeName="transform" type="rotate" from="0 78,18" to="-35 78,18" dur="0.55s" repeatCount="indefinite"/>
    <!-- 鹈鹕腿 -->
    <line x1="-42" y1="18" x2="-32" y2="68" stroke="#E0E0E0" stroke-width="11"/>
    <line x1="0" y1="18" x2="12" y2="68" stroke="#E0E0E0" stroke-width="11"/>
    <!-- 左脚 -->
    <polygon points="-42,68 -32,76 -22,68" fill="#E0E0E0"/>
    <!-- 右脚 -->
    <polygon points="0,68 12,76 22,68" fill="#E0E0E0"/>
  </g>
  <animateTransform attributeName="transform" type="translate" from="480,210" to="680,210" dur="10s" repeatCount="indefinite"/>
</svg>
</body>
</html>
